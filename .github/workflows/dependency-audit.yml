name: Dependency audit

# Runs on every commit. Scans with `pnpm audit`, attempts to fix high/critical
# advisories, and opens a pull request only when the full test suite passes.
on:
  push:
    # The PR branch is pushed by this same workflow; skip it to avoid a
    # redundant run (relevant when a PAT is used, since PAT pushes do trigger
    # workflows unlike GITHUB_TOKEN pushes).
    branches-ignore:
      - chore/dependency-audit
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and attempt fixes
        id: audit
        env:
          AUDIT_REPORT: ${{ runner.temp }}/audit-report.md
        run: bash scripts/audit-fix.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Only on the default branch, and only if every step above succeeded —
      # i.e. the fixes applied by the audit step keep typecheck and tests green.
      #
      # GITHUB_TOKEN can open the PR only when the repository setting
      # "Allow GitHub Actions to create and approve pull requests" is enabled.
      # When that is not an option, set a DEPENDENCY_AUDIT_TOKEN secret (a
      # fine-grained PAT with Contents + Pull requests: Read and write) and it
      # is used automatically instead.
      - name: Create pull request
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DEPENDENCY_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/dependency-audit
          delete-branch: true
          commit-message: 'chore(deps): fix high/critical advisories'
          title: 'chore(deps): fix high/critical advisories'
          body-path: ${{ runner.temp }}/audit-report.md
