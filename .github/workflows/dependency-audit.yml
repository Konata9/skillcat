name: Dependency audit

# Runs on every commit. Scans with `pnpm audit` and, only when high/critical
# advisories are found, attempts to fix them, runs the test suite and opens a
# pull request. A clean audit ends the job early.
on:
  push:
    # The PR branch is pushed by this same workflow; skip it to avoid a
    # redundant run (relevant when a PAT is used, since PAT pushes do trigger
    # workflows unlike GITHUB_TOKEN pushes).
    branches-ignore:
      - chore/dependency-audit
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit and attempt fixes
        id: audit
        env:
          AUDIT_REPORT: ${{ runner.temp }}/audit-report.md
        run: bash scripts/audit-fix.sh

      # No high/critical advisories means nothing to fix, so skip typecheck,
      # tests and the PR entirely.
      - name: Nothing to fix
        if: steps.audit.outputs.vulnerable != 'true'
        run: echo "No high/critical advisories found — skipping typecheck, tests and pull request."

      - name: Typecheck
        if: steps.audit.outputs.vulnerable == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.audit.outputs.vulnerable == 'true'
        run: pnpm test

      # Only when there was something to fix, on the default branch, and only if
      # every step above succeeded — i.e. the applied fixes keep typecheck and
      # tests green.
      #
      # GITHUB_TOKEN can open the PR only when the repository setting
      # "Allow GitHub Actions to create and approve pull requests" is enabled.
      # When that is not an option, set a DEPENDENCY_AUDIT_TOKEN secret (a
      # fine-grained PAT with Contents + Pull requests: Read and write) and it
      # is used automatically instead.
      - name: Create pull request
        if: |
          steps.audit.outputs.vulnerable == 'true' &&
          github.event_name == 'push' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DEPENDENCY_AUDIT_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/dependency-audit
          delete-branch: true
          commit-message: 'chore(deps): fix high/critical advisories'
          title: 'chore(deps): fix high/critical advisories'
          body-path: ${{ runner.temp }}/audit-report.md
