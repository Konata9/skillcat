name: Release

# Publishes a release whenever the project version changes.
# The version is declared once in the root package.json; `pnpm dist:*` syncs it
# into apps/desktop/package.json, which Electron's `app.getVersion()` and
# electron-builder read for the in-app version and artifact names.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      force:
        description: Release the current version even if it did not change
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decide whether this push should release, before any toolchain setup. The
  # script is pure shell, so it needs no Node/pnpm and cannot hit the
  # setup-node cache-save failure when a release is skipped.
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so we can diff the version against the base of
          # the push and detect whether a release already exists.
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          FORCE: ${{ inputs.force }}
          BASE_REF: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/detect-version-change.sh

  # Build one platform per runner. electron-builder only builds for the host OS,
  # so macOS artifacts come from macos-latest and Windows artifacts from
  # windows-latest.
  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            script: dist:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - os: windows-latest
            name: windows
            script: dist:win
            files: |
              apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.name }}
        env:
          # macOS builds are unsigned; skip certificate auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm ${{ matrix.script }}

      # Refuse to publish anything that accidentally carries user config or a
      # credential (the app stores those per-user, never in the bundle).
      - name: Check artifacts for leaked config or secrets
        run: pnpm check:secrets

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Publish a single release with every platform's artifacts attached.
  release:
    needs: [detect, build]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: v${{ needs.detect.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
