name: Release

# Publishes a macOS release whenever the project version changes.
# The version is declared once in the root package.json; `pnpm dist` syncs it
# into apps/desktop/package.json, which Electron's `app.getVersion()` and
# electron-builder read for the in-app version and artifact names.
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      force:
        description: Release the current version even if it did not change
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so we can diff the version against the previous
          # commit and detect whether a tag already exists.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Detect version change
        id: version
        env:
          FORCE: ${{ inputs.force }}
          BASE_REF: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/detect-version-change.sh

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build macOS release
        if: steps.version.outputs.changed == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm dist

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
