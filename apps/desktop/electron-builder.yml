appId: com.konata9.skillcat
productName: SkillCat
copyright: Copyright © 2026 konata9
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
mac:
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  identity: null
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  # The staged `skills` CLI (scripts/bundle-skills-cli.mjs) is shipped as a real
  # directory outside the asar, so macOS builds run it with their own
  # Electron-as-Node runtime and need no system Node install. Windows builds do
  # not bundle it yet and use the system Node/npx fallback.
  extraResources:
    - from: resources/skills-cli
      to: skills-cli
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
linux:
  icon: build/icon.png
  category: Development
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}
dmg:
  title: SkillCat
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
